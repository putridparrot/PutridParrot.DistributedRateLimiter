services:
  app:
    container_name: putridparrot-distributed-rate-limiter
    build:
      context: .
      dockerfile: PutridParrot.DistributedRateLimiter.Sample/Dockerfile
    image: putridparrot-distributed-rate-limiter:local
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      DistributedRateLimiting__RedisConnectionString: redis:6379
    depends_on:
      redis:
        condition: service_healthy

  redis:
    container_name: putridparrot-redis
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

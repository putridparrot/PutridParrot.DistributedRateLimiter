{{- if .Values.app.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "drl.name" . }}
  namespace: {{ include "drl.namespace" . }}
  labels:
    app: {{ include "drl.name" . }}
  annotations:
{{ toYaml .Values.app.ingress.annotations | indent 4 }}
spec:
  ingressClassName: {{ .Values.app.ingress.className }}
  rules:
    - host: {{ .Values.app.ingress.host }}
      http:
        paths:
          - path: {{ .Values.app.ingress.path }}
            pathType: {{ .Values.app.ingress.pathType }}
            backend:
              service:
                name: {{ include "drl.name" . }}
                port:
                  number: {{ .Values.app.service.port }}
{{- end }}
